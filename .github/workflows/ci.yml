name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 环境自检 + 端到端成书 + 满版校验
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 霞鹜文楷是版式对齐的关键，缺了正文会回退成系统默认字体。
      # 这里装的是字体文件本体；Linux 上还要跑 fc-cache 让 fontconfig 感知到。
      - name: 安装霞鹜文楷字体
        shell: bash
        run: |
          mkdir -p "$HOME/.fonts"
          curl -fsSL -o "$HOME/.fonts/LXGWWenKai-Regular.ttf" \
            "https://github.com/lxgw/LxgwWenKai/releases/download/v1.520/LXGWWenKai-Regular.ttf"
          if command -v fc-cache >/dev/null 2>&1; then fc-cache -f; fi

      # Ubuntu runner 自带 Chrome/Chromium，但 /usr/bin 下不一定有，
      # 而 microsoft-edge 稳定通道最省事，也与 find_browser() 的候选列表一致。
      # 注意：不要用 apt 装 chromium-browser —— Ubuntu 24.04 换成了 snap 过渡包，会失败。
      - name: 确保浏览器可用
        shell: bash
        run: |
          set -e
          ok=0
          for b in microsoft-edge microsoft-edge-stable google-chrome-stable chromium chromium-browser; do
            if command -v "$b" >/dev/null 2>&1; then ok=1; echo "found: $b"; fi
          done
          if [ "$ok" = "0" ]; then
            echo "未找到浏览器，安装 microsoft-edge…"
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-edge.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y microsoft-edge fonts-noto-cjk
          fi

      - name: 环境自检
        run: python scripts/check_env.py

      # 端到端：出书 → 侧边栏书签 → 满版校验（失败会非零退出，卡住合并）
      - name: 端到端成书
        run: |
          python scripts/make_book.py \
            --md-file examples/sample.md \
            --split-by h2 \
            --title "像企业家一样写作" \
            --author "示例作者" \
            --cover-style forest \
            --motif path \
            --meta "样稿 · 演示" \
            --out build/ci-sample.pdf

      - name: 封面满版校验
        run: python scripts/check_bleed.py build/ci-sample.pdf

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.os }}
          path: build/ci-sample.pdf

  cover-only:
    name: 独立封面生成器（8 套主题）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 出封面（矢量，不依赖浏览器截图）
        run: |
          python scripts/make_cover.py --title "闭环" --author "古思" \
            --style red-bright --format svg --out build/cover.svg
